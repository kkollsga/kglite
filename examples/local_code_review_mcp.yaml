# Local code-review workspace — the second of the two workspace archetypes
# (the first is examples/open_source_workspace_mcp.yaml, the github-clone
# tracker). Run it with:
#
#   kglite-mcp-server --mcp-config /abs/path/to/local_code_review_mcp.yaml
#
# What it is: point the server at a directory tree on disk, and it builds an
# in-memory code-tree graph (functions, classes, calls, imports, docs) that an
# agent explores with graph_overview(), exact named recipe queries, and raw
# cypher_query(). `set_root_dir(path)` swaps the active root at any time
# (rebuild fires lazily on the next graph tool call); `watch: true` re-tags the
# graph dirty when a code file under the active root changes. The graph lives
# only for the server's lifetime — it's never written to disk.
#
# Verify it after editing: `kglite-mcp-server --selftest --mcp-config THIS.yaml`
# drives a live handshake and prints green/red per capability.
#
# NOTE: after editing this file (or your client's MCP config), RESTART the
# server / client — manifest changes are read once at boot.

name: Code Review

# Environment discovery already walks upward for a `.env`; the GitHub tools
# are simply hidden when no token is reachable. To pin a different file,
# uncomment this with a path that exists (relative paths resolve from here):
# env_file: /abs/path/to/your/.env

# Bundled kglite methodology + framework defaults inject into matching tool
# descriptions (graph-first sequencing, code-graph hygiene skills).
skills:
  - true

# Domain instructions. The lazy-tool-discovery steer ("graph_overview and
# cypher_query are ALWAYS registered; search the registry for 'cypher' before
# falling back to grep") is appended automatically for workspace modes — no
# need to repeat it here.
instructions: |
  Local code-graph workspace for reviewing any directory on disk.

  PRIMARY TOOLS: graph_overview + run_recipe_query + cypher_query. A bare
  graph_overview reports whether a named query catalog is present. Use the
  code_review recipe only for its exact Function-scoped operations; use raw
  cypher_query for every broader or differently scoped structural question.
  Use grep / read_source ONLY for literal text search (error strings,
  comments, config keys), never to rediscover structure the graph encodes.

  Workflow:
    1. set_root_dir('/abs/path/to/repo')          — switch active root + build graph
    2. graph_overview()                            — inventory of node types
    3. graph_overview(types=['Function'])          — properties + samples
    4. cypher_query("MATCH ... RETURN ...")        — explore
    5. read_code_source(qualified_name='Type::m')  — single-call source read
    6. read_source(file_path=..., grep='...')      — direct file slice

  GitHub tools (when GITHUB_TOKEN is in .env):
  - github_issues(number=N) / github_issues(query='...')  — issues, PRs, discussions
  - github_api(path)                                       — raw read-only GitHub REST GET

workspace:
  kind: local
  # The STARTING root, and the parent the agent swaps within. Set it WIDE (a
  # parent containing every project you want reachable) so the agent can move
  # laterally between subdirectories without a restart. Replace with your own path.
  #
  # NOT a boundary on its own — that was a documentation error corrected on
  # 2026-07-31. Before kglite 0.15.5 / mcp-methods 0.4.3 nothing constrained
  # where set_root_dir could point; a swap to any readable directory succeeded.
  root: /abs/path/to/your/projects
  # The actual boundary — opt in. A set_root_dir outside it is refused and the
  # active root does not move. Requires kglite 0.15.5+ / mcp-methods 0.4.3+.
  # Usually the same path as `root`; widen only if you intend swaps outside it.
  sandbox_root: /abs/path/to/your/projects
  # Auto-rebuild on file change. Rebuilds are scoped to the active set_root_dir
  # target (not the wide root) and fire lazily on the next tool call, so a wide
  # boundary stays cheap. Boot build is deferred until the first set_root_dir.
  watch: true

# Boot-validated, read-only shortcuts for the exact first-pass Function
# questions in `local_code_review_mcp.skills/initial_code_review.md`. The YAML
# declares operations only; the colocated skill owns sequencing and fallback.
extensions:
  cypher_recipes:
    code_review:
      description: Exact Function-scoped operations for an initial code review.
      queries:
        resolve_function:
          description: Resolve Function nodes with exactly the supplied qualified_name.
          parameters:
            type: object
            properties:
              qualified_name:
                type: string
                description: Fully qualified Function name.
            required: [qualified_name]
            additionalProperties: false
          cypher: |
            MATCH (target:Function)
            WHERE target.qualified_name = $qualified_name
            RETURN target.qualified_name AS qualified_name,
                   target.file_path AS file_path,
                   target.line_number AS line_number
            ORDER BY qualified_name, file_path, line_number

        direct_callers:
          description: Return Function nodes with a direct Function-to-Function CALLS edge to the target Function.
          parameters:
            type: object
            properties:
              qualified_name:
                type: string
                description: Fully qualified target Function name.
            required: [qualified_name]
            additionalProperties: false
          cypher: |
            MATCH (caller:Function)-[:CALLS]->(target:Function)
            WHERE target.qualified_name = $qualified_name
            RETURN DISTINCT caller.qualified_name AS qualified_name,
                            caller.file_path AS file_path,
                            caller.line_number AS line_number
            ORDER BY qualified_name, file_path, line_number

        affected_tests:
          description: Return test Function nodes reaching the target Function through CALLS paths of length 1..5; this is not comprehensive impact analysis.
          parameters:
            type: object
            properties:
              qualified_name:
                type: string
                description: Fully qualified target Function name.
            required: [qualified_name]
            additionalProperties: false
          cypher: |
            MATCH (test:Function)-[:CALLS*1..5]->(target:Function)
            WHERE target.qualified_name = $qualified_name
              AND test.is_test = true
            RETURN DISTINCT test.qualified_name AS qualified_name,
                            test.file_path AS file_path,
                            test.line_number AS line_number
            ORDER BY qualified_name, file_path, line_number
