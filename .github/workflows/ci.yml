name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A rapid follow-up push to a PR branch supersedes the in-flight run — cancel
# it instead of finishing ~20 jobs whose verdict nobody will read. Runs on
# `main` (publish-triggering) and the weekly schedule are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single-source pin for every stable-toolchain job in this workflow. Local
  # dev verifies against it via `make check-toolchain-pin` (part of
  # gate-push): floating `@stable` on both sides meant clippy verdicts
  # diverged whenever either side updated first. Bump deliberately, together
  # with the local toolchain.
  RUST_STABLE: "1.98.0"
  CARGO_TERM_COLOR: always

jobs:
  dedup:
    name: Prior green PR run check
    # On a push to main that fast-forwards a PR head already proven green,
    # re-running the full ~20-job suite is pure duplication (~2.5
    # runner-hours per release). This job asks whether THIS EXACT SHA has a
    # completed successful pull_request run of this same workflow; if so,
    # every gated job below skips, and `ci-success` (which tolerates
    # `skipped`) still reports the green the publish gate waits on. Any
    # other event, or no prior green run, means a fresh full suite.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fresh: ${{ steps.check.outputs.fresh }}
    steps:
      - name: Look for a prior green pull_request run of this SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "event=${{ github.event_name }} — full suite"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Failure of the query itself must mean "run the suite", never
          # "skip it" — a dedup that can silently skip on an API error is a
          # gate that cannot fail.
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&status=success&per_page=1"             -q '.workflow_runs | length' 2>/dev/null || echo 0)
          if [ "$green" = "1" ]; then
            echo "SHA $SHA already green in a pull_request run — skipping the suite"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "no prior green pull_request run for $SHA — full suite"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt
      - name: Check generated documentation facts
        run: python scripts/render_docs_facts.py --check
      - name: Build HTML documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  rust-checks:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        # Swatinem/rust-cache@v2, matching the Python/Perf jobs (migrated in
        # 0.9.52). The old actions/cache@v5 cached the whole `target/` dir
        # unpruned (~3.5 GB via the broad restore-keys fallback), which
        # occasionally failed the cache-restore `tar` with a partial write
        # ("Wrote only N of M bytes") and took the job down. Swatinem prunes
        # the cache (drops workspace-crate artifacts + incremental) and
        # treats a restore failure as non-fatal.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: API chokepoint gate
        # Enforce the kglite::api single-chokepoint boundary: server crates
        # stay at zero below-api reaches; the wheel's reach count can only
        # shrink from its frozen baseline (docs/history/roadmap-2026H1.md).
        run: ./scripts/check_api_chokepoint.sh

      - name: Check Cypher clean-room contract
        run: python scripts/check_cypher_clean_room.py

      - name: Check dependency license policy
        run: python scripts/check_dependency_licenses.py

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test

      - name: Verify published optional features outside the workspace
        run: bash scripts/check_packaged_features.sh

  rust-core-coverage:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Rust core coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with coverage tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: llvm-tools-preview

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Cache cargo registry and coverage target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-core-coverage
          workspaces: ". -> target"

      - name: Measure kglite core with default features
        run: cargo llvm-cov --package kglite --lib --tests --ignore-filename-regex 'src/bin/' --lcov --output-path rust-core-coverage.lcov

      - name: Upload report-only Rust core coverage
        uses: codecov/codecov-action@v7
        with:
          files: rust-core-coverage.lcov
          flags: rust-core
          name: rust-core
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  source-quality:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Production source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install function-metric parser (python tree-sitter)
        # scripts/function_metrics.py replaced the retired in-tree
        # code_tree_stats bin as the gate's metrics source — no cargo
        # build needed for this job anymore.
        run: pip install tree-sitter tree-sitter-rust
      - name: Exercise intentional failure fixtures
        run: |
          python scripts/check_source_quality.py --self-test
          python scripts/check_lint_allowances.py --self-test
      - name: Check centralized structure and complexity ceilings
        run: |
          python scripts/check_source_quality.py
          python scripts/check_lint_allowances.py
      - name: Validate temporary RustSec exception policy
        run: python scripts/check_rustsec_advisories.py --policy-only

  msrv-matrix:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    # Derives the MSRV job's matrix from the manifests themselves. A
    # hard-coded matrix would let the declared `rust-version` and the job
    # that verifies it drift apart — which is the exact failure a declared-
    # but-unchecked MSRV creates, just moved one level up. The script also
    # fails when a workspace member declares no `rust-version` at all, so a
    # new crate cannot join without picking a floor.
    name: Derive MSRV matrix from manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Show the declared floors
        run: python scripts/msrv_matrix.py
      - id: derive
        run: python scripts/msrv_matrix.py --github >> "$GITHUB_OUTPUT"

  msrv:
    # Builds every published crate on exactly the Rust version it declares.
    # We publish five crates to crates.io; before 0.15 none of them declared
    # a `rust-version`, so a consumer on an older toolchain got a confusing
    # compile error from somewhere inside the dep tree instead of a clear
    # "package X requires rustc 1.88" from cargo.
    #
    # The floors are NOT uniform and deliberately so: `kglite-cli` needs
    # 1.89 (rustyline 18 calls `File::lock_shared` while declaring no
    # `rust-version` of its own) and `kglite-bolt-server` needs 1.91 (boltr).
    # Forcing one number would have raised the engine's floor to 1.91 for no
    # reason.
    #
    # Default features only. Optional `okf`/`rdf` are checked on the engine
    # group; `fastembed` is excluded because it pulls a ~200 MB ONNX runtime
    # (the `kglite-c` job skips it for the same reason).
    name: MSRV ${{ matrix.toolchain }} (${{ matrix.label }})
    needs: msrv-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.msrv-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-${{ matrix.toolchain }}
          workspaces: ". -> target"

      - name: Build on the declared MSRV
        run: cargo check ${{ matrix.packages }}

      - name: Build the engine's optional format loaders on the same floor
        if: matrix.core == 'true'
        run: cargo check -p kglite --features okf,rdf

  minimal-versions:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    # WHAT THIS CATCHES
    # -----------------
    # A dependency requirement that understates the version our own code
    # actually needs. `mcp-methods = "0.4"` while calling APIs added in
    # 0.4.1 (fixed in 3114caab) is the reference case. This class is
    # STRUCTURALLY INVISIBLE to the repo that declares it: our committed
    # lockfile already held 0.4.1 and a fresh resolve picks the newest
    # match, so every local build and every other CI job resolved the
    # working version. Only a consumer whose lock pinned 0.4.0 ever saw it,
    # and only as a compile error in their repo.
    #
    # This job removes that blindness by resolving our DIRECT dependencies
    # DOWN to their declared minimums and building the result.
    #
    # WHAT THIS DOES NOT CATCH
    # ------------------------
    # `-Z direct-minimal-versions` lowers only the direct dependencies of
    # workspace members; transitive dependencies still resolve normally.
    # A third-party crate that understates ITS floor is not detected here.
    # Full `-Z minimal-versions` would cover that, but it fails across the
    # ecosystem on crates that never declared accurate floors, so its
    # output would be noise rather than signal.
    #
    # It also does not check that a floor is TIGHT — a needlessly high
    # declared minimum resolves and builds fine. Overstating is the benign
    # direction (the consumer gets a clear resolution error, not a
    # mysterious compile failure), so that asymmetry is acceptable.
    #
    # IT IS A PLAIN BLOCKING GATE (since 2026-07-28)
    # ---------------------------------------------
    # It resolves our DIRECT dependencies down to their declared floors and
    # builds the result. Both steps must pass; there is no
    # `continue-on-error` anywhere in this job.
    #
    # Getting here took fixing 19 under-declared floors across the workspace
    # (anyhow, async-trait, clap, flate2, hyper, hyper-util, indexmap, libc,
    # mcp-methods, memchr, regex, same-file, stacker, subtle, tempfile, tokio,
    # tracing, tracing-subscriber) plus one upstream release. Each was
    # established by compiling against it — and, where a version compiles yet
    # misbehaves, by RUNNING it: below `anyhow` 1.0.47, `anyhow!("{e}")`
    # compiles with only a warning and then prints the literal "{e}".
    #
    # The last blocker was not ours: mcp-methods declared `ignore = "0.4"`
    # while calling `WalkBuilder::filter_entry` (0.4.15+). That shipped as
    # mcp-methods 0.4.2, which is why the floor here is 0.4.2 and not 0.4.1.
    #
    # This job spent two days as `continue-on-error`, and that is worth
    # remembering rather than deleting: the flag made it structurally unable
    # to fail, the Steps API reports `conclusion: success` for a
    # continue-on-error step that exited 101, and on the strength of that
    # green a false claim about this job reached this file and CHANGELOG.md
    # twice before human review caught it. If a future upstream floor forces
    # this job to be tolerant again, use a scoped expected-failure contract —
    # a step that goes red on anything except one named crate, and red again
    # when that crate stops failing — never a blanket `continue-on-error`.
    #
    # Non-vacuity is verified, not assumed: with `3114caab` temporarily
    # reverted (`mcp-methods = "0.4"`), resolution selects mcp-methods 0.4.0
    # and the build fails on the missing `ActivationBuild` / `ActivationRequest`
    # / `PreparedActivation` symbols. See the plan doc for the transcript.
    name: Minimal versions (declared dependency floors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `continue-on-error` anywhere in this job — not job-level, not on
    # any step. That flag made this job structurally incapable of failing:
    # the Steps API reports `conclusion: success` for a step that exited
    # 101, and on the strength of that green a false claim about this job
    # reached this file and CHANGELOG.md twice before review caught it.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly (for -Z direct-minimal-versions)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Rust stable (builds the lowered lockfile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimal-versions
          workspaces: ". -> target"

      - name: Resolve direct dependencies down to their declared minimums
        id: resolve
        run: |
          set -o pipefail
          cargo +nightly -Z direct-minimal-versions generate-lockfile 2>&1 | tee resolve.log

      - name: Build against the lowered lockfile
        id: build
        if: steps.resolve.outcome == 'success'
        run: |
          set -o pipefail
          cargo check --workspace --locked 2>&1 | tee build.log

      - name: Report
        if: always()
        # Reports BOTH steps. The previous version said only "resolution
        # succeeded; see the build step", which combined with
        # `continue-on-error` (the Steps API reports `success` for a step that
        # exited 101) made a failing build read as a pass — the summary and
        # the job badge both said fine while `cargo check` was aborting. If
        # you are reading this job's result anywhere other than the step log,
        # read this summary.
        run: |
          {
            echo "## Minimal versions"
            if [ "${{ steps.resolve.outcome }}" != "success" ]; then
              echo "**Resolution to declared minimums FAILED** — a declared floor is"
              echo "unreachable or understated. First conflict:"
              echo ''
              echo '```'
              tail -n 25 resolve.log || true
              echo '```'
            elif [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "Resolution **and** build at declared minimums both succeeded."
            else
              echo "Resolution succeeded, but the **build at declared minimums FAILED**."
              echo "A floor is understated — ours, or one a dependency declares."
              echo ''
              echo '```'
              grep -E '^(error|warning: unused)' build.log | sort -u | head -n 25 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rustsec-audit:
    name: Required RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-audit@0.22.2
      - name: Deny unreviewed RustSec findings
        run: python scripts/check_rustsec_advisories.py

  kglite-c:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: kglite-c (C ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy

      - name: Cache cargo registry & target
        # Swatinem/rust-cache@v2 — see the Rust-checks job for why (the old
        # actions/cache@v5 of the full target/ dir flaked on restore).
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kglite-c
          workspaces: ". -> target"

      # Build + lint + test with the optional format loader on.
      # fastembed is off here because it pulls a ~200 MB ONNX runtime
      # we don't want on every CI run; the default-feature build below
      # verifies the no-fastembed path stays compilable.
      - name: Clippy (rdf)
        run: cargo clippy -p kglite-c --all-targets --features rdf -- -D warnings

      - name: Tests (rdf)
        run: cargo test -p kglite-c --features rdf

      # Default-feature build — what consumers get without opting
      # into any format / embedder feature. Keeps the no-extras
      # path honest.
      - name: Clippy (default features)
        run: cargo clippy -p kglite-c --all-targets -- -D warnings

      - name: Tests (default features)
        run: cargo test -p kglite-c

      # Header-drift gate — cbindgen runs in build.rs and writes
      # include/kglite.h. We commit that file (binding consumers
      # point at it directly without rebuilding kglite-c). CI must
      # verify the committed copy matches a fresh cbindgen run, or
      # any Go / JS / JVM binding compiled against the wrong header
      # silently mismatches the library.
      - name: Header drift gate (cbindgen vs committed)
        run: |
          # Force a clean regen by removing the header, building
          # with all features on (the union surface), and diffing
          # against the committed copy.
          rm -f crates/kglite-c/include/kglite.h
          touch crates/kglite-c/build.rs
          cargo build -p kglite-c --features fastembed,rdf
          git diff --exit-code -- crates/kglite-c/include/kglite.h || {
            echo "::error::Committed include/kglite.h is out of date — re-run 'cargo build -p kglite-c --features fastembed,rdf' and commit the result."
            exit 1
          }

  python-lint:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install ruff
        # Pinned deliberately: `pip install ruff` floats to the newest release,
        # so a formatter change in an unrelated ruff release turns every open
        # branch red with no source change behind it. Bump this in a dedicated
        # commit that also reformats and updates local environments.
        run: pip install ruff==0.16.0

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

  python-tests:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache cargo registry & target
        # 0.9.52: switched from actions/cache@v5 to Swatinem/rust-cache@v2.
        # The Swatinem action is purpose-built for cargo — it knows how
        # to handle target/ (drops stale incremental artifacts, keeps
        # build-script outputs), sets CARGO_INCREMENTAL/RUSTC_WRAPPER
        # sanely, and uses a smarter cache key that lets unrelated
        # changes hit the cache. Wheels workflow has been using it since
        # 0.9.22; this brings CI in line.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: py${{ matrix.python-version }}
          workspaces: ". -> target"

      - name: Install dependencies
        # pyyaml is not optional. tests/test_ci_workflow.py parses these
        # workflow files and imports it unguarded on purpose: an
        # `importorskip` there would turn a missing parser into a skip, and a
        # skip is a pass — to pytest and to the `ci-success` aggregate job
        # alike — which is the exact "gate that cannot fail" shape those tests
        # exist to prevent.
        run: pip install maturin pytest pytest-timeout pandas hypothesis pyyaml -r requirements/coverage.txt

      - name: Install pyarrow for the coexistence canary (newest-python leg only)
        # Only the newest-python leg installs pyarrow, so tests/test_pyarrow_coexistence.py
        # actually runs somewhere in CI instead of skipping on every leg. It guards
        # against the dual-allocator teardown SIGSEGV (kglite + pyarrow's bundled
        # mimalloc), fixed by pinning our mimalloc to v2.
        #
        # UNPINNED BY DESIGN: this is a canary. We WANT the newest pyarrow release
        # (and, on 3.14, the newest CPython allocator behaviour) so a future
        # pyarrow/CPython change that reintroduces the clash trips this leg early.
        # Do not pin it.
        if: matrix.python-version == '3.14'
        run: pip install pyarrow

      - name: Build and install extension with integration extras
        # [networkx] keeps the bridge suite active instead of import-skipping;
        # [neo4j] supplies the Bolt client used by the protocol smoke tests.
        # The MCP server is bundled Rust code and has no Python extra.
        run: pip install -e '.[neo4j,networkx]'

      - name: Build protocol servers and the Python release wheel
        # Both protocol smoke suites skip when their standalone binary is
        # absent, so materialize the current MCP and Bolt adapters explicitly.
        #
        # The binary-size gate measures the extension users receive, not the
        # core Rust library. Use maturin so macOS extension-module linkage gets
        # the same configuration as production wheels; a raw cargo build is
        # not a portable way to link a PyO3 extension.
        run: |
          cargo build --release -p kglite-mcp-server -p kglite-bolt-server
          rm -rf /tmp/kglite-binary-size-wheel
          maturin build --release --out /tmp/kglite-binary-size-wheel

      - name: Smoke-test the NetworkX extra from an installed wheel
        if: matrix.python-version == '3.12'
        run: |
          rm -rf /tmp/kglite-networkx-wheel /tmp/kglite-networkx-smoke
          maturin build --release --out /tmp/kglite-networkx-wheel
          wheel="$(find /tmp/kglite-networkx-wheel -name '*.whl' -print -quit)"
          python -m venv /tmp/kglite-networkx-smoke
          /tmp/kglite-networkx-smoke/bin/pip install "${wheel}[networkx]"
          cd /tmp
          /tmp/kglite-networkx-smoke/bin/python -c "import networkx as nx; import pandas; import kglite; graph = kglite.from_networkx(nx.path_graph(3)); assert graph.to_networkx().number_of_nodes() == 3"
          /tmp/kglite-networkx-smoke/bin/kglite --help | grep -- 'session'
          /tmp/kglite-networkx-smoke/bin/kglite-mcp-server --help | grep -- '--selftest'

      - name: Prefetch all-feature dependency metadata
        # The dependency-license contract deliberately reruns metadata offline.
        # Populate crates used only by optional features before that gate runs.
        run: cargo metadata --format-version 1 --locked --all-features > /dev/null

      - name: Run Python tests
        run: pytest tests/ -v --tb=short --cov=kglite --cov-branch --cov-config=pyproject.toml --cov-report=xml:coverage.xml

      - name: Run Bolt smoke + correctness + robustness tests
        # Covers handshake, scalars, params, Node/Rel, transactions, auth,
        # FAILURE mapping, and robustness. `not benchmark` excludes the
        # dual-marked `bolt+benchmark` perf suite at
        # `tests/benchmarks/test_bench_bolt.py` — those need the
        # `pytest-benchmark` plugin which CI doesn't install (perf
        # baselines are captured locally via
        # `make refresh-release-constants`, not gated in CI).
        run: pytest tests/ -m "bolt and not benchmark" -v --tb=short

      - name: Run binary-size gate
        # Production source structure and complexity run once in the
        # dedicated source-quality job. This test alone needs the release
        # artifact built above, so it carries `@pytest.mark.binary_size`.
        run: pytest tests/test_phase5_parity.py -m binary_size -v

      - name: Run stubtest
        if: matrix.python-version == '3.12'
        run: |
          pip install mypy pandas-stubs
          python -m mypy.stubtest kglite --ignore-missing-stub --ignore-unused-allowlist --mypy-config-file mypy_stubtest.ini --allowlist stubtest_allowlist.txt

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          name: python
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  free-threading:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Free-threading (no-GIL) smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Set up free-threaded Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: '3.14t'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: free-threading
          workspaces: ". -> target"

      - name: Build extension into a free-threaded venv (abi3 off)
        # abi3 (the limited API) doesn't cover the free-threaded build, so the
        # extension is built per-version with `--no-default-features` (drops the
        # `abi3` default) + `python-extension,mcp-server` (re-adds the
        # default server the wheel ships, minus abi3). The build itself is
        # a real test: PyO3 0.29 enforces `Sync` on every `#[pyclass]` for a
        # free-threaded target, so a non-thread-safe class fails to compile here.
        #
        # Use `maturin develop` (not `build` + `pip install <wheel>`): it
        # compiles the extension editable-into the local `kglite/` package dir,
        # so `import kglite` from the repo root resolves to the freshly built
        # `.so`. A plain `pip install <wheel>` leaves the source-tree `kglite/`
        # (which has no compiled extension) shadowing the installed package →
        # `ModuleNotFoundError: No module named 'kglite.kglite'`.
        run: |
          python -m venv .ftvenv
          ./.ftvenv/bin/pip install -q maturin pytest pytest-timeout pandas
          VIRTUAL_ENV="$PWD/.ftvenv" ./.ftvenv/bin/maturin develop --release \
            --no-default-features --features python-extension,mcp-server

      - name: Assert GIL is actually disabled + run concurrency suite
        # Backs the module's `gil_used = false` declaration with a real run:
        # imports under no-GIL, asserts the GIL stays off under a threaded
        # query load, and exercises the shared Session / FrozenGraph model.
        run: |
          ./.ftvenv/bin/python -c "import sys, kglite; assert not sys._is_gil_enabled(), 'GIL unexpectedly enabled'; print('no-GIL OK')"
          ./.ftvenv/bin/python -m pytest tests/test_freethreading.py tests/test_concurrency.py tests/test_session.py -v --tb=short

  perf-regression:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Perf regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFERENCE_VERSION: "0.13.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/benchmark.txt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf
          workspaces: ". -> target"

      - name: Create isolated reference and candidate environments
        run: |
          python -m venv .venv
          python -m venv "$RUNNER_TEMP/kglite-reference"
          .venv/bin/python -m pip install maturin==1.14.1 -r requirements/benchmark.txt
          "$RUNNER_TEMP/kglite-reference/bin/python" -m pip install -r requirements/benchmark.txt
          python -m pip download --only-binary=:all: --no-deps \
            "kglite==$REFERENCE_VERSION" --dest "$RUNNER_TEMP/reference-wheel"
          REFERENCE_WHEEL=$(find "$RUNNER_TEMP/reference-wheel" -name '*.whl' -print -quit)
          "$RUNNER_TEMP/kglite-reference/bin/python" -m pip install "$REFERENCE_WHEEL"
          echo "REFERENCE_PY=$RUNNER_TEMP/kglite-reference/bin/python" >> "$GITHUB_ENV"
          echo "REFERENCE_WHEEL=$REFERENCE_WHEEL" >> "$GITHUB_ENV"
          echo "HARNESS_DIR=$RUNNER_TEMP/kglite-core-harness" >> "$GITHUB_ENV"

      - name: Build candidate wheel before measurement
        run: |
          .venv/bin/maturin build --release --out "$RUNNER_TEMP/candidate-wheel"
          .venv/bin/python scripts/check_wheel_license.py --expected-name kglite "$RUNNER_TEMP/candidate-wheel/*.whl"
          CANDIDATE_WHEEL=$(find "$RUNNER_TEMP/candidate-wheel" -name '*.whl' -print -quit)
          CANDIDATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kglite") | .version')
          .venv/bin/python -m pip install "$CANDIDATE_WHEEL"
          echo "CANDIDATE_WHEEL=$CANDIDATE_WHEEL" >> "$GITHUB_ENV"
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"

      - name: Copy the frozen harness outside the checkout
        run: |
          mkdir -p "$HARNESS_DIR"
          cp tests/benchmarks/test_bench_core.py "$HARNESS_DIR/test_bench_core.py"

      - name: Benchmark published 0.13.2 wheel
        working-directory: ${{ runner.temp }}/kglite-core-harness
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: |
          "$REFERENCE_PY" -m pytest test_bench_core.py -m benchmark \
            --benchmark-min-rounds=100 \
            --benchmark-warmup=on --benchmark-warmup-iterations=20 \
            --benchmark-json="$GITHUB_WORKSPACE/.bench-reference-0.13.2.json"

      - name: Thermal settle
        run: sleep 30

      - name: Benchmark candidate wheel
        working-directory: ${{ runner.temp }}/kglite-core-harness
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest test_bench_core.py -m benchmark \
            --benchmark-min-rounds=100 \
            --benchmark-warmup=on --benchmark-warmup-iterations=20 \
            --benchmark-json="$GITHUB_WORKSPACE/.bench-candidate.json"

      - name: Validate benchmark isolation and record provenance
        run: |
          .venv/bin/python scripts/benchmark_provenance.py \
            --reference-python "$REFERENCE_PY" \
            --candidate-python .venv/bin/python \
            --reference-wheel "$REFERENCE_WHEEL" \
            --candidate-wheel "$CANDIDATE_WHEEL" \
            --reference-json .bench-reference-0.13.2.json \
            --candidate-json .bench-candidate.json \
            --expected-names tests/benchmarks/baselines/current.json \
            --harness "$HARNESS_DIR/test_bench_core.py" \
            --candidate-version "$CANDIDATE_VERSION" \
            --output .bench-provenance.json

      - name: Compare candidate (retry once on a regression verdict)
        # Single-run benchmark captures on shared runners flake: 0.14.3's main
        # push failed at +21.6% on a 20% threshold minutes after the identical
        # SHA passed on the PR. A genuine regression reproduces on an
        # immediate second capture; runner noise doesn't — so a first-capture
        # failure triggers exactly one recapture, and only a repeated failure
        # is red. Both captures are uploaded as evidence either way.
        #
        # The two legs measure different things and are gated differently.
        #
        # Leg 1 — candidate vs the 0.13.2 wheel benchmarked *in this same job,
        # on this same runner, minutes apart*. Machine speed cancels out, so
        # 20% is a real 20% and stays there.
        #
        # Leg 2 — candidate vs `current.linux.json`, a capture committed from
        # some *other* runner at some *other* time. Its delta carries the
        # runner-to-runner spread on top of the code's, and the recorded flakes
        # are all in this leg: 0.14.3 failed at +21.6%, and `return_node_10k`
        # has flaked at +26-32% in runs where the normalized read moved +4%.
        # 20% here is below the instrument's own noise, so it fires on machine
        # variance and trains everyone to re-run it. 30% clears every recorded
        # flake and still catches gross absolute drift — which is all this leg
        # is for; leg 1 is the one that catches a real regression, and its 20%
        # is untouched. Widening is deliberately preferred over dropping the
        # leg: a slow, uniform slide that leg 1 renormalizes away has to show
        # up somewhere.
        run: |
          compare() {
            python scripts/compare_bench.py \
              .bench-reference-0.13.2.json "$1" \
              --metric min --threshold 20 --require-exact-set \
            && python scripts/compare_bench.py \
              tests/benchmarks/baselines/current.linux.json "$1" \
              --metric min --threshold 30 --require-exact-set
          }
          if compare .bench-candidate.json; then
            exit 0
          fi
          echo "::warning::Perf gate failed on the first capture — recapturing once to rule out runner noise."
          sleep 30
          (
            cd "$HARNESS_DIR" &&
            PYTHONNOUSERSITE=1 PYTHONPATH= "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest test_bench_core.py -m benchmark \
              --benchmark-min-rounds=100 \
              --benchmark-warmup=on --benchmark-warmup-iterations=20 \
              --benchmark-json="$GITHUB_WORKSPACE/.bench-candidate-retry.json"
          )
          compare .bench-candidate-retry.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-perf-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .bench-reference-0.13.2.json
            .bench-candidate.json
            .bench-candidate-retry.json
            .bench-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  public-api:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Feature-complete public API gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Locks the public API surface of the `kglite` core crate (api:: + every
    # other `pub` item) against accidental signature changes that would break
    # downstream Rust embedders / the C ABI. Complements check_api_chokepoint.sh
    # (which gates *reaches past* the boundary, not the boundary's own shape)
    # and the kglite-c cbindgen header-drift gate.
    #
    # cargo-public-api needs nightly rustdoc-JSON. The toolchain, tool version,
    # Cargo-feature classifications, profiles, and exact baseline paths all
    # come from tests/api-baselines/rust-api-profiles.json.
    steps:
      - uses: actions/checkout@v7

      - name: Validate profile manifest and install pinned nightly
        run: |
          python scripts/rust_api_profiles.py validate
          nightly="$(python scripts/rust_api_profiles.py value nightly)"
          rustup toolchain install "$nightly" --profile minimal

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
          workspaces: ". -> target"

      - name: Install cargo-public-api (pinned)
        run: |
          version="$(python scripts/rust_api_profiles.py value cargo_public_api_version)"
          cargo install cargo-public-api --locked --version "$version"

      - name: Diff every feature profile against its exact baseline
        run: python scripts/rust_api_profiles.py check

      - name: Check packaged implementation-only feature
        run: bash scripts/check_packaged_features.sh

  storage-parity:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Cross-storage parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: storage-parity
          workspaces: ". -> target"
      - name: Build test extension
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install maturin pytest pytest-timeout pandas
          .venv/bin/maturin develop --release
      - name: Run bounded memory/mapped/disk parity matrix
        run: |
          .venv/bin/pytest -m parity -v --tb=short \
            tests/test_storage_parity.py \
            tests/test_phase1_parity.py tests/test_phase2_parity.py \
            tests/test_phase3_parity.py tests/test_phase4_parity.py \
            tests/test_phase5_parity.py::test_graph_copy_cow_correctness_memory \
            tests/test_phase5_parity.py::test_graph_copy_cow_correctness_mapped

  disk-concurrency:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Disk concurrency regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: disk-concurrency
          workspaces: ". -> target"
      - name: Build test extension
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install maturin pytest pytest-timeout pandas
          .venv/bin/maturin develop --release
      - name: Run bounded disk ownership and arena regressions
        run: |
          .venv/bin/pytest -v --tb=short \
            tests/test_concurrency.py::TestConcurrentReads::test_concurrent_disk_reads_keep_materialized_nodes_alive \
            tests/test_disk_mutation_roundtrip.py::test_disk_writer_lease_is_enforced_across_processes \
            tests/test_disk_mutation_roundtrip.py::test_disk_parallel_projection_node_weight_is_race_free \
            tests/test_disk_mutation_roundtrip.py::test_disk_parallel_projection_no_interner_corruption \
            tests/test_session.py::test_disk_session_reuses_writer_lineage_and_composes

  native-lifecycle-locks:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Native lifecycle locks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-lifecycle-${{ matrix.os }}
          workspaces: ". -> target"
      - name: Test core cross-process lease recovery
        run: cargo test -p kglite --lib graph::io::open::tests::crashed_process_releases_writer_lease -- --exact --nocapture
      - name: Test core lease-protected publication
        run: cargo test -p kglite --lib graph::io::open::tests::writer_lease_serializes_open_create_and_publish -- --exact
      # The two filters above already compile the whole engine test binary, so
      # running the rest of it is close to free — and this is the only job that
      # exercises the engine on Windows at all (no Windows job runs pytest, yet
      # Windows wheels ship). It covers two things nothing else does:
      #   * storage-backend file lifetimes, where Windows differs from POSIX —
      #     a file with an open mapped view cannot be resized, replaced or
      #     deleted, which this job is what first caught;
      #   * the stack-depth bound against non-Linux frame sizes, via
      #     stack_probe::budget_ceiling_query_fits_the_query_thread_stack,
      #     which walks the deepest AST the parser accepts, so a platform with
      #     much larger frames overflows here instead of in a user's process.
      - name: Test core engine unit suite
        run: cargo test -p kglite --lib
      - name: Test CLI lifecycle unit suite
        run: cargo test -p kglite-cli

  loom-session:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Loom Session model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom-session
          workspaces: ". -> target"
      - name: Explore Session lock interleavings
        run: RUSTFLAGS="--cfg loom" cargo test -p kglite --test loom_session

  miri-loaders:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Miri unsafe loader checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Prepare Miri
        run: cargo miri setup
      - name: Check packed decoding and N-Triples parsing
        run: |
          cargo miri test -p kglite --lib packed_primitives_decode_from_misaligned_little_endian_bytes
          cargo miri test -p kglite --lib parse_line_borrowed_uri_boundaries_are_valid
          cargo miri test -p kglite --lib parse_line_preserves_utf8_literal_boundaries

  address-sanitizer:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: AddressSanitizer disk arenas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check packed decoding and arena lifetimes
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: |
          cargo test -p kglite --lib --target x86_64-unknown-linux-gnu packed_primitives_decode_from_misaligned_little_endian_bytes
          cargo test -p kglite --lib --target x86_64-unknown-linux-gnu overlapping_query_guards_keep_materializations_alive

  # `-Zbuild-std` is not an optimisation here, it is what makes the job compile
  # at all. TSan is an ABI-changing sanitizer, and rustc rejects linking
  # instrumented code against the *precompiled* std shipped with the toolchain
  # ("mixing `-Zsanitizer` will cause an ABI mismatch in crate ..."). Building
  # std from source under the same flag is also the only way the run means
  # anything: an uninstrumented std hides the synchronisation TSan is here to
  # observe. Do not silence the error with `-Cunsafe-allow-abi-mismatch` — that
  # restores a build that links two ABIs and reports races it cannot see.
  bolt-driver-conformance:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: Bolt conformance (official JS + Java drivers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Python driver has always been regression-tested; these are the two
    # other official Bolt drivers that matter. Java is the load-bearing one:
    # the JVM has no in-process route to a kglite graph, so this server is the
    # entire integration surface there and the driver's behaviour cannot be
    # assumed. Both suites live in tests/conformance/<lang>/ and cover the same
    # checks; tests/test_bolt_driver_conformance.py starts the server and
    # asserts parity between them.
    #
    # Deliberately its own job rather than a step in `python-tests`: that job is
    # a 4-way Python matrix, and neither driver suite depends on the Python
    # version, so running them there would cost four redundant JVM setups.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Deliberately NOT `cache: maven`. That caches ~/.m2/repository, and
          # tests/test_bolt_driver_conformance.py runs maven with
          # `-Dmaven.repo.local=tests/conformance/java/.m2` so it never
          # pollutes a developer's home repo. The built-in cache therefore
          # pointed at a directory this job never writes: it warned
          # "Path Validation Error: Path(s) ... do(es) not exist" on every run
          # and saved nothing, while maven re-downloaded the Neo4j driver each
          # time. The explicit cache below covers the path actually used.

      - name: Cache the conformance Maven repository
        uses: actions/cache@v6
        with:
          path: tests/conformance/java/.m2
          key: conformance-m2-${{ runner.os }}-${{ hashFiles('tests/conformance/java/pom.xml') }}
          restore-keys: conformance-m2-${{ runner.os }}-

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/conformance/js/package.json

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bolt-driver-conformance
          workspaces: ". -> target"

      - name: Install test-harness dependencies
        # Mirrors the `python-tests` job: pytest itself, pytest-timeout because
        # `[tool.pytest.ini_options]` sets `timeout`, and pandas because
        # tests/conftest.py imports it at module scope, so collection fails
        # without it. Installing only the project (below) leaves none of these
        # present — that is why this job's first real execution died with
        # `pytest: command not found`.
        run: pip install pytest pytest-timeout pandas

      - name: Install the Python test harness
        # The harness only drives the two suites and the server; it needs the
        # wheel for the fixture-graph builder in tests/conftest.py, and the
        # neo4j Python driver is what `_build_bolt_fixture_graph` imports
        # through the shared bolt helpers.
        run: pip install -e '.[neo4j]'

      - name: Verify the JS and Java toolchains are usable
        # Both suites skip themselves when a toolchain is missing, which is
        # right locally but would make this job pass vacuously in CI — the
        # failure mode that hid here until its first real run. Prove each tool
        # exists *and* executes before the suites get a chance to skip.
        # `javac -version` rather than a which-check: macOS ships stubs, and a
        # broken JDK install should read as broken, not absent.
        run: |
          set -euo pipefail
          for tool in node npm javac java mvn; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH — the conformance suites would skip and this job would pass without testing anything"
              exit 1
            fi
          done
          node --version
          npm --version
          javac -version
          mvn -version

      - name: Build the Bolt server
        run: cargo build --release -p kglite-bolt-server

      - name: Run official JS + Java driver conformance
        # `-rs` prints skip reasons, so a toolchain that failed to install
        # shows up as a visible skip rather than a silent green.
        run: pytest tests/test_bolt_driver_conformance.py -m bolt -v -rs --tb=short --junitxml=conformance.xml

      - name: Assert both driver suites actually ran
        # pytest exits 0 for an all-skipped run, so the step above cannot by
        # itself distinguish "both drivers conform" from "nothing executed".
        # This job exists to test the JS and Java drivers; if either skipped —
        # offline Maven, a failed npm install, a missing Bolt binary — that is
        # a CI failure, not a pass.
        run: python scripts/assert_conformance_ran.py conformance.xml

  kglite-java:
    needs: [dedup]
    if: needs.dedup.outputs.fresh == 'true'
    name: kglite-java (JVM binding)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Java wrapper's only CI home. Two things ride on it that nothing else
    # covers:
    #   * AbiContractTest::statusCodesMatchHeader is the ONLY gate in the repo
    #     pinning the numeric C-ABI status discriminants. The cbindgen
    #     header-drift check (kglite-c job) regenerates both sides from source,
    #     so a discriminant *renumber* passes it — this suite is what catches
    #     it, by asserting the Java-side numbers against the committed header.
    #   * The cross-binding embedding parity suite proves a vector store + HNSW
    #     index written by one binding reads and scores identically through the
    #     other. That needs BOTH bindings live in one job, which is why this job
    #     builds the Python extension as well as the JVM binding.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Set up JDK 26
        # 26, not the 22 floor: build.gradle.kts pins the Gradle toolchain to
        # JavaLanguageVersion.of(26) (compiling against --release 22), so the
        # build needs a 26 JDK present. Same version publish_java.yml uses.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Pinned, and no wrapper in the repo — CI is the only place the
          # build's Gradle version is written down. Matches publish_java.yml.
          gradle-version: '9.7.0'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kglite-java
          workspaces: ". -> target"

      - name: Build the C ABI library the binding loads
        # Debug, not release: this is a correctness job, and the debug profile
        # keeps the engine's debug-only assertions live. NativeLibrary's
        # workspace tier resolves target/debug/libkglite_c.so for both the JVM
        # suite and the parity harness, so nothing needs -Dkglite.native.path.
        run: cargo build -p kglite-c

      - name: Build the Python extension for the cross-binding parity leg
        # Lean feature set: the parity test uses only the core engine
        # (KnowledgeGraph, set_embeddings, build_vector_index, load, cypher),
        # so the ~100-package MCP default is not paid for here. Debug profile,
        # same correctness reason as the C ABI build above.
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest pytest-timeout pandas
          .venv/bin/maturin develop --no-default-features --features abi3,python-extension

      - name: Run the JVM binding suite (ABI contract + embeddings + parity harness)
        # `build` runs the whole JUnit suite, including AbiContractTest — the
        # discriminant gate — and compiles the test classes the parity pytest
        # shells out to. No -PrequireAllNatives: this job resolves the native
        # through the workspace build, not the bundled resources.
        run: gradle -p kglite-java build

      - name: Run the cross-binding embedding parity suite
        # KGLITE_JAVA_PARITY=1 makes a missing JDK or missing compiled classes a
        # hard failure instead of a skip, so this cross-binding proof cannot
        # pass by not running. Both directions (Java->Python, Python->Java) run.
        env:
          KGLITE_JAVA_PARITY: '1'
        run: .venv/bin/pytest tests/test_java_python_embedding_parity.py -v --tb=short

  ci-success:
    name: CI success
    # Single aggregate gate the publish workflows wait on. It fails if ANY CI
    # job failed or was cancelled, so a new CI job is covered just by adding it
    # to `needs` here — no more hand-maintained per-check allowlists in the two
    # publish workflows (the gap that let 0.11.6 ship to PyPI/crates.io while
    # the free-threading job was red: it simply wasn't in the allowlist).
    #
    # `if: always()` makes this run after every dependency regardless of their
    # outcome, so it always produces a definitive pass/fail check to wait on.
    needs:
      - dedup
      - docs
      - rust-checks
      - rust-core-coverage
      - source-quality
      - msrv-matrix
      - msrv
      # `minimal-versions` is a plain blocking gate as of 0.15.2 — no
      # `continue-on-error` at any level, so a red there is red here.
      - minimal-versions
      - rustsec-audit
      - kglite-c
      - kglite-java
      - python-lint
      - python-tests
      - bolt-driver-conformance
      - free-threading
      - perf-regression
      - public-api
      - storage-parity
      - disk-concurrency
      - native-lifecycle-locks
      - loom-session
      - miri-loaders
      - address-sanitizer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI jobs passed
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "CI job results: $results"
          case ",$results," in
            *,failure,* | *,cancelled,*)
              echo "::error::At least one CI job did not succeed — blocking release."
              exit 1
              ;;
            *)
              echo "All CI jobs succeeded."
              ;;
          esac
