name: Scheduled

# The heavy race/stress verification that stays off the per-PR critical path:
# ThreadSanitizer Session checks, the dependency advisory report, and the
# bounded Session/Bolt stress runs. Weekly by schedule; manual dispatch exists
# because a schedule-only job is otherwise unrunnable between Mondays, so a
# fix to one cannot be verified for up to a week (the thread-sanitizer job
# was broken from the day it was added and stayed red for five scheduled runs
# for exactly that reason). Split out of ci.yml (2026-08-26) so PR checks
# stop listing three permanently-skipped rows.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch: {}

env:
  # Must equal ci.yml's value (tests/test_ci_workflow.py enforces the
  # match). `env` does not cross workflow files: the two stable jobs
  # below referenced RUST_STABLE from the day of the split and every
  # scheduled run failed at toolchain install with an empty input.
  RUST_STABLE: "stable"
  CARGO_TERM_COLOR: always

jobs:
  scheduled-thread-sanitizer:
    name: Scheduled ThreadSanitizer Session checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
      # Three filters, not one. `graph::session` covers the concurrency model
      # this job was built for; the two `parallel` filters cover the opt-in
      # parallel Cypher runtime, whose regions fan a read-only `&DirGraph`
      # across rayon workers. Those tests are where a data race would show up,
      # and a substring filter does not pick them up on its own.
      - name: Run Session, disk and parallel-runtime concurrency models under TSan
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
        run: |
          cargo test -Zbuild-std -p kglite --lib --target x86_64-unknown-linux-gnu graph::session
          cargo test -Zbuild-std -p kglite --lib --target x86_64-unknown-linux-gnu graph::parallel
          cargo test -Zbuild-std -p kglite --lib --target x86_64-unknown-linux-gnu executor::tests::parallel

  dependency-maintenance:
    name: Scheduled dependency advisory report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2
      - name: Validate temporary advisory exceptions
        run: python scripts/check_rustsec_advisories.py --policy-only
      # No `--workspace`: that flag limits the update to workspace members, so
      # the report read "Locking 0 packages" while 107 updates were pending.
      - name: Report compatible lockfile updates
        continue-on-error: true
        run: cargo update --dry-run
      - name: Report RustSec advisories
        continue-on-error: true
        run: python scripts/check_rustsec_advisories.py

  # A consumer of the published crates resolves without our Cargo.lock, so it
  # gets each dependency's newest compatible release, which the lockfile-pinned
  # PR jobs never build. fastembed 7.8.0 broke that build for every
  # `--features fastembed` consumer (it moved tokenizers' regex backend behind
  # a feature we did not name) while CI stayed green on the pinned 7.5.0.
  # This job resolves fresh and checks every published crate with its
  # optional features, so an upstream break surfaces within a week.
  fresh-resolve-build:
    name: Scheduled build against the newest dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Resolve every dependency to its newest compatible version
        run: cargo update
      - name: Check the published crates with their optional features
        run: |
          cargo check --locked -p kglite --lib --features fastembed,okf,parallel-bz2,rdf,xlsx
          cargo check --locked -p kglite-c --lib --features fastembed,rdf
          cargo check --locked -p kglite-mcp-server --features fastembed
          cargo check --locked -p kglite-bolt-server -p kglite-cli

  scheduled-concurrency-stress:
    name: Scheduled bounded Session and Bolt stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: scheduled-concurrency-stress
          workspaces: ". -> target"
      - name: Build release extension and Bolt server
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest pytest-timeout pandas neo4j
          .venv/bin/maturin develop --release
          cargo build --release -p kglite-bolt-server
      - name: Run bounded Session stress
        run: .venv/bin/pytest tests/test_session_stress.py -m stress -v --tb=short
      - name: Run bounded Bolt stress
        run: .venv/bin/pytest tests/test_bolt_server_concurrency.py -m bolt_stress -v --tb=short


  scheduled-reader-mutation:
    name: Scheduled mapped-reader mutation run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: scheduled-reader-mutation
          workspaces: ". -> target"
      # Debug profile on purpose: the reader's debug assertions are part of what
      # the run looks for. The seed is random per run and printed first, so a
      # red run is replayable with KGLITE_MUTATION_SEED and KGLITE_MUTATION_ONLY
      # (the failure message prints the exact command).
      - name: Mutate mapped files for twenty minutes
        env:
          KGLITE_MUTATION_ITERS: "100000000"
          KGLITE_MUTATION_SECONDS: "1200"
        run: |
          export KGLITE_MUTATION_SEED=$(od -An -N6 -tu8 /dev/urandom | tr -d ' ')
          echo "mutation seed: $KGLITE_MUTATION_SEED"
          cargo test -p kglite --lib -- mutation_long --ignored --nocapture
