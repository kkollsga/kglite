[package]
name = "kglite-cli"
version.workspace = true
edition = "2021"
# Above the 1.88.0 workspace floor: `rustyline 19` declares no
# `rust-version` of its own but uses `cfg_select!`, stabilized in 1.95.0. On
# 1.93 and 1.94 it fails with E0658 `use of unstable library feature
# 'cfg_select'` (bisected: 1.95.0 is the first release that compiles it), so
# the metadata floor understates the real one.
rust-version = "1.95.0"
authors = ["Kristian dF Kollsgård <kkollsg@gmail.com>"]
license = "MIT"
description = "Pure-Rust KGLite CLI: an interactive Cypher shell for .kgl knowledge graphs"
readme = "README.md"
repository = "https://github.com/kkollsga/kglite"
homepage = "https://github.com/kkollsga/kglite"
keywords = ["cypher", "repl", "shell", "knowledge-graph", "kglite"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "kglite"
path = "src/main.rs"

[dependencies]
# Reuse kglite's pure-Rust surface (kglite::api::*) — no libpython link
# in the resulting binary. Mirrors the kglite-bolt-server / kglite-mcp-server
# pattern: path dep locally, version requirement on `cargo publish`. The
# requirement tracks the exact workspace version (`make bump-version
# VERSION=X.Y.Z`; `make gate` fails on drift).
kglite = { version = "0.21.4", path = "../kglite", default-features = false, features = ["okf", "rdf", "iana-zones"] }

# Line editor: prompt, history, Emacs/Vi keybindings, Ctrl-C/Ctrl-D handling.
# The standard Rust REPL choice; not otherwise a workspace dep.
rustyline = "19"

# SIGINT → cancel the in-flight query (sets the flag execute_mut polls).
# rustyline keeps the prompt in raw mode, so Ctrl-C only raises SIGINT while
# a query is actually running.
# 3.2, not "3": ctrlc 3.0.0 calls libc::sem_init, which libc 0.2.191 no longer
# exposes on macOS, so a minimal-versions resolve fails to compile there. 3.2 is
# the version checked; 3.0 and 3.1 were not tried.
ctrlc = "3.2"

# `.mode json` output via kglite::api::param::kglite_value_to_json.
serde_json = "1.0.154"

# The hand-written `Serialize` for a JSON result row. serde_json's *serializer*
# writes `serialize_map` entries in iteration order, while its `Value::Object`
# is a `BTreeMap` and sorts them, so an ordered row has to be serialised rather
# than built as a `Value`. Already in the tree as serde_json's own dependency;
# no `derive`, only the trait.
serde = "1.0.229"

# `.import <file.csv> <Type>` — parse the CSV; rows are passed as a Cypher
# `$rows` param (values parameterized, not interpolated). Already a `kglite` dep.
csv = "1.4"

clap = { version = "4.6.7", features = ["derive"] }
# 1.0.47 is a BEHAVIOURAL floor, not just a compiling one. Below it,
# `anyhow!("... {e}")` does not capture `e` -- the macro routed a lone
# literal straight to `Error::msg`, so the message printed the literal
# text "{e}". kglite-cli relies on inline captures (src/lib.rs:405 and
# others). Verified by RUNNING each version, not by compiling: 1.0.45
# prints "failed: {e}", 1.0.47 prints "failed: BOOM" (1.0.46 is yanked).
# 1.0.20 also matters (anyhow::Error::msg, used by mcp-methods) and
# 1.0.5 (Context for Option, used by kglite-cli); 1.0.47 covers all.
# The declared floor is 1.0.104 because mcp-methods 0.6.1 requires it (before
# that, getrandom 0.4 -> wasip3 -> wit-bindgen-rust-macro required ^1.0.72), and
# a minimal-versions resolve cannot select a lower anyhow beside it.
anyhow = "1.0.104"

# Agent result envelopes use mcp-methods' renderer only. Keep server features
# disabled so the standalone CLI does not acquire an async/MCP runtime.
mcp-methods = { version = "0.6.2", default-features = false }

# Opaque retained-result handles come directly from the operating system RNG.
getrandom = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
