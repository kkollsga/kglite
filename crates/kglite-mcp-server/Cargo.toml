[package]
name = "kglite-mcp-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["Kristian dF Kollsgård <kkollsg@gmail.com>"]
license = "MIT"
description = "MCP server for kglite knowledge graphs — pure-Rust single-binary frontend for cypher_query / graph_overview / save_graph / read_code_source plus the generic source / GitHub surface from mcp-methods. No libpython link."
readme = "README.md"
repository = "https://github.com/kkollsga/kglite"
homepage = "https://github.com/kkollsga/kglite"
documentation = "https://kglite.readthedocs.io/en/latest/python/guides/mcp-servers.html"
keywords = ["mcp", "knowledge-graph", "cypher", "kglite", "graph"]
categories = ["database", "command-line-utilities"]

# The server body lives in the library (`run`) so two frontends share
# one build: this crate's thin binary (`cargo install`, libpython-free)
# and the `kglite` Python wheel's PyO3 wrapper (which calls `run` inside
# `py.detach`). No duplicated engine, no separate wheel.
[lib]
name = "kglite_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "kglite-mcp-server"
path = "src/main.rs"

[dependencies]
# Generic MCP server framework (rmcp + manifest + source/github tools).
# Switched from git+rev to crates.io in 0.9.26+ — mcp-methods publishes
# there as of 0.3.30. Cargo.lock locks the exact version; bumps are
# explicit via `cargo update -p mcp-methods`. We still depend on the
# pure-Rust crate only (no pyo3 in tree, no libpython link).
# 0.3.42 required: serve_prompts injects skill `description` (## When to
# use) + honors `references_tools`, which the cross-tool skills below need.
# 0.4.4 is a real MINIMUM, not a floor-by-habit: `lib.rs` uses
# ActivationBuild / ActivationRequest / ActivationTransactionHook /
# PreparedActivation and Workspace::with_activation_transaction, all of
# which landed in 0.4.1. Version 0.4.4 aligns the framework's public
# types with rmcp 3.1.1; resolving an older 0.4.x alongside our direct
# rmcp 3 dependency produces incompatible public handler types.
# 0.4.5 is a behavioural floor, not just a compile one: below it, GitHub
# tools register on token *reachability* alone, so an ambient GITHUB_TOKEN
# widens a deployment's agent-visible surface without its manifest saying
# so. From 0.4.5 that needs `builtins.github: true`, which is what our
# tools_allow contract and the smoke suite's default-off arms assert.
# 0.4.6 is the compile floor now: `register_typed_tool_fallible` (the
# `Fn(T) -> Result<String, String>` registration behind every KGLite route
# that can genuinely fail) does not exist below it, and it is what makes a
# failed tool call report `isError: true` to a programmatic client instead
# of an error-shaped success body. Same release also runs the result
# postprocess hook on the error arm, so our identity/rebuild footers still
# reach an agent reading a failure.
mcp-methods = { version = "0.4.6", default-features = false, features = ["server"] }

# kglite (pure-Rust core) — no pyo3 in the resulting binary, no
# libpython link. The 0.10.1 lift moved KnowledgeGraph +
# source_location into kglite::api so mcp-server no longer needs
# to route through the kglite-py wheel crate (which would drag
# pyo3 along). Local dev uses the path dep; `cargo publish`
# strips path and falls back to the version requirement, which tracks
# the exact workspace version (`make bump-version VERSION=X.Y.Z`;
# `make gate` fails on drift).
# Verified: `cargo tree -p kglite-mcp-server | grep pyo3` → empty.
kglite = { version = "0.16.13", path = "../kglite", default-features = false }

# rmcp re-export for the dynamic tool registration path.
rmcp = { version = "3.1.1", features = ["server", "macros", "transport-io", "schemars"] }

# 1.37.0, not "1": rmcp 3.1.1 calls tokio::sync::mpsc::Receiver::is_closed,
# added in 1.37.0, and uses tokio::task::JoinSet, added in 1.21.0 (both
# bisected against the individual releases). hyper 1.x independently
# needs >=1.13. Cargo unifies tokio workspace-wide, so both servers
# declare the same floor even though only kglite-mcp-server pulls rmcp.
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "time", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
# 1.10 is a real minimum: tokenizers 0.22 requires regex ^1.10, and the
# `std` feature tracing-subscriber needs only exists from 1.3.0. Cargo
# unifies the version workspace-wide, so a bare "1" let
# direct-minimal-versions select regex 1.0.0 for the whole tree.
regex = "1.10"
schemars = "1"
# ISO-8601 formatting of the active-graph build timestamp surfaced in
# graph_overview / cypher_query / set_root_dir output. Already in the
# resolved dep graph via kglite core — direct dep, zero extra build cost.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# 1.0.47 is a BEHAVIOURAL floor, not just a compiling one. Below it,
# `anyhow!("... {e}")` does not capture `e` -- the macro routed a lone
# literal straight to `Error::msg`, so the message printed the literal
# text "{e}". kglite-cli relies on inline captures (src/lib.rs:405 and
# others). Verified by RUNNING each version, not by compiling: 1.0.45
# prints "failed: {e}", 1.0.47 prints "failed: BOOM" (1.0.46 is yanked).
# 1.0.20 also matters (anyhow::Error::msg, used by mcp-methods) and
# 1.0.5 (Context for Option, used by kglite-cli); 1.0.47 covers all.
anyhow = "1.0.47"
clap = { version = "4.3", features = ["derive"] }

# Logging
tracing = "0.1.35"

# CSV-over-HTTP server (extensions.csv_http_server). hyper 1.x with
# its server adapter from hyper-util — both are already in the
# resolved dep graph (rmcp uses hyper transitively), so this just
# surfaces them as direct deps for the csv_http module.
hyper = { version = "1.1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.3", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3.10.0"
# Exercise hidden-tool rejection through a real in-memory MCP handshake. The
# production dependency enables only the server half; client code is test-only.
rmcp = { version = "3.1.1", features = ["client"] }

[features]
# `fastembed` is an OPTIONAL feature, default OFF. Enabling it
# pulls in `kglite/fastembed` → fastembed → ort-sys, which has
# a flaky upstream binary download (parcel.pyke.io CDN) that
# caused 0.10.1 CI breakage when the rust-cache invalidated and
# the fresh download silently produced broken link instructions.
# Users who want `text_score()` semantic search via the YAML
# manifest `extensions.embedder` block: `cargo install
# kglite-mcp-server --features fastembed`. Users who don't need
# it (the common case — most MCP servers are just cypher_query
# + graph_overview + read_code_source) get a smaller binary,
# faster build, and no ONNX runtime dep.
default = []
fastembed = ["kglite/fastembed"]
