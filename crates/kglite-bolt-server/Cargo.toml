[package]
name = "kglite-bolt-server"
version.workspace = true
edition = "2021"
# Above the 1.88.0 workspace floor: `boltr 0.2.0` declares
# `rust-version = "1.91.0"`. This was previously recorded only as a
# comment further down this file; now it is the actual contract.
rust-version = "1.91.0"
authors = ["Kristian dF Kollsgård <kkollsg@gmail.com>"]
license = "MIT"
description = "Pure-Rust Bolt v5.x protocol server for kglite knowledge graphs, with a regression-tested Neo4j Python driver path."
readme = "README.md"
repository = "https://github.com/kkollsga/kglite"
homepage = "https://github.com/kkollsga/kglite"
documentation = "https://kglite.readthedocs.io/en/latest/operators/bolt-server.html"
keywords = ["bolt", "neo4j", "cypher", "knowledge-graph", "kglite"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "kglite-bolt-server"
path = "src/main.rs"

[dependencies]
# Reuse kglite's pure-Rust surface (kglite::api::*) — no libpython link
# in the resulting binary. Mirrors the kglite-mcp-server pattern.
# `default-features = false` skips the `abi3` toggle (which only matters
# for wheel builds) but keeps the lib compilable for cargo's binary
# build. No `fastembed` here — Bolt server is a wire transport and
# doesn't expose `text_score()`-style semantic search.
# Phase G.4: the kglite engine crate is the workspace member at crates/kglite/. The pyo3-wrapper
# crate (`kglite-py`) is now the separate workspace member that
# bolt-server NEVER depends on — keeps pyo3 out of this binary's
# dep tree (verified via `cargo tree -p kglite-bolt-server | grep
# pyo3` → empty).
# Local dev uses the path dep; `cargo publish` strips path and falls
# back to the version requirement (so this crate publishes against
# the crates.io kglite). The requirement tracks the exact workspace
# version; `make bump-version VERSION=X.Y.Z` moves it, and `make gate`
# fails if it drifts.
kglite = { version = "0.16.17", path = "../kglite", default-features = false }

# Bolt v5.x protocol library. Implements PackStream framing, message
# dispatch, session state machine, handshake. We implement BoltBackend
# (the 11-method seam in boltr::server::BoltBackend) and hand the
# instance to BoltServer::builder(...).serve(addr).
#
# boltr v0.2.0 requires rust-version = "1.91.0" — which is why this crate
# declares `rust-version = "1.91.0"` above instead of inheriting the
# workspace 1.88.0 floor. Phase B's plan calls out the upstream-churn
# risk; we accept it because hand-rolling Bolt framing for Phase B alone
# is not the right shape.
boltr = { version = "0.2", features = ["tls"] }

# Phase F #6: rustls crypto provider for boltr's TLS support.
# boltr enables tokio-rustls but doesn't pick a crypto provider —
# we install `ring` at startup (see main.rs). `ring` is the more
# battle-tested option; `aws-lc-rs` is the alternative.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Async trait sugar used by boltr's BoltBackend trait declaration.
# 0.1.89 is the real workspace floor, not this crate's alone: kglite-mcp-server
# pulls rmcp 3.1.1, whose optional auth path requires async-trait ^0.1.89,
# and cargo unifies the version across the workspace. Declaring "0.1" let
# direct-minimal-versions lower it to 0.1.0 and fail resolution outright --
# caught by the minimal-versions CI job added in 0.15.1.
async-trait = "0.1.89"

# 1.37.0, not "1": rmcp 3.1.1 calls tokio::sync::mpsc::Receiver::is_closed,
# added in 1.37.0, and uses tokio::task::JoinSet, added in 1.21.0 (both
# bisected against the individual releases). hyper 1.x independently
# needs >=1.13. Cargo unifies tokio workspace-wide, so both servers
# declare the same floor even though only kglite-mcp-server pulls rmcp.
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }

clap = { version = "4.3", features = ["derive"] }
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.8", features = ["env-filter"] }
# 1.0.47 is a BEHAVIOURAL floor, not just a compiling one. Below it,
# `anyhow!("... {e}")` does not capture `e` -- the macro routed a lone
# literal straight to `Error::msg`, so the message printed the literal
# text "{e}". kglite-cli relies on inline captures (src/lib.rs:405 and
# others). Verified by RUNNING each version, not by compiling: 1.0.45
# prints "failed: {e}", 1.0.47 prints "failed: BOOM" (1.0.46 is yanked).
# 1.0.20 also matters (anyhow::Error::msg, used by mcp-methods) and
# 1.0.5 (Context for Option, used by kglite-cli); 1.0.47 covers all.
anyhow = "1.0.47"
sha2 = "0.11"
# 2.5.0, not "2": rustls 0.23 (above) requires subtle ^2.5.0, and cargo
# unifies the version across the workspace, so "2" let
# direct-minimal-versions pick 2.0.0 and fail resolution.
subtle = "2.5.0"
# `Value::DateTime(NaiveDate)` arithmetic for the Bolt Date encoding
# (days-since-Unix-epoch). Already transitive via kglite; pin to the
# same version range so a workspace-level chrono bump touches us too.
chrono = { version = "0.4.45", default-features = false }
