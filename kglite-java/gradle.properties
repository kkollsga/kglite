# Bound the Gradle build JVM heap explicitly. On a CI runner the JVM sizes its
# default heap from the container's cgroup limit, which GitHub's runners report
# in a way that leaves the build/test JVM too small — the first CI run of this
# suite hit `OutOfMemoryError: Java heap space` while a forked test loaded the
# native engine. An explicit ceiling is predictable across every environment.
org.gradle.jvmargs=-Xmx2g
